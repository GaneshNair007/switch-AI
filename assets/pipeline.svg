Count="indefinite"/><animate attributeName="opacity" values=".8;0;0" keyTimes="0;.18;1" dur="10.8s" begin="3.6s" repeatCount="indefinite"/></circle><circle cx="502" cy="100" r="36" fill="#0a0e1f" stroke="#4ade80" stroke-width="3" filter="url(#glow)"/><text x="502" y="111" font-size="32" fill="#4ade80" font-weight="900" text-anchor="middle" >3</text><text x="502" y="177" font-size="19" fill="#e8eaff" font-weight="800" text-anchor="middle" >Defense</text><text x="502" y="202" font-size="13" fill="#9aa3c7" font-weight="400" text-anchor="middle" >answer or CONCEDED</text><circle cx="698" cy="100" r="36" fill="none" stroke="#fbbf24" stroke-width="2"><animate attributeName="r" values="36;58;58" keyTimes="0;.18;1" dur="10.8s" begin="5.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;0" keyTimes="0;.18;1" dur="10.8s" begin="5.4s" repeatCount="indefinite"/></circle><circle cx="698" cy="100" r="36" fill="#0a0e1f" stroke="#fbbf24" stroke-width="3" filter="url(#glow)"/><text x="698" y="111" font-size="32" fill="#fbbf24" font-weight="900" text-anchor="middle" >4</text><text x="698" y="177" font-size="19" fill="#e8eaff" font-weight="800" text-anchor="middle" >Rollback Proof</text><text x="698" y="202" font-size="13" fill="#9aa3c7" font-weight="400" text-anchor="middle" >version · command · owner</text><circle cx="894" cy="100" r="36" fill="none" stroke="#c084fc" stroke-width="2"><animate attributeName="r" values="36;58;58" keyTimes="0;.18;1" dur="10.8s" begin="7.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;0" keyTimes="0;.18;1" dur="10.8s" begin="7.2s" repeatCount="indefinite"/></circle><circle cx="894" cy="100" r="36" fill="#0a0e1f" stroke="#c084fc" stroke-width="3" filter="url(#glow)"/><text x="894" y="111" font-size="32" fill="#c084fc" font-weight="900" text-anchor="middle" >5</text><text x="894" y="177" font-size="19" fill="#e8eaff" font-weight="800" text-anchor="middle" >Human Verdict</text><text x="894" y="202" font-size="13" fill="#9aa3c7" font-weight="400" text-anchor="middle" >approver role only</text><circle cx="1090" cy="100" r="36" fill="none" stroke="#22d3ee" stroke-width="2"><animate attributeName="r" values="36;58;58" keyTimes="0;.18;1" dur="10.8s" begin="9.0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;0" keyTimes="0;.18;1" dur="10.8s" begin="9.0s" repeatCount="indefinite"/></circle><circle cx="1090" cy="100" r="36" fill="#0a0e1f" stroke="#22d3ee" stroke-width="3" filter="url(#glow)"/><text x="1090" y="111" font-size="32" fill="#22d3ee" font-weight="900" text-anchor="middle" >6</text><text x="1090" y="177" font-size="19" fill="#e8eaff" font-weight="800" text-anchor="middle" >Release Brief</text><text x="1090" y="202" font-size="13" fill="#9aa3c7" font-weight="400" text-anchor="middle" >signed, auditable artifact</text><circle r="8" fill="#fff" filter="url(#glow)"><animateMotion dur="10.8s" repeatCount="indefinite" path="M110 100H1090"/></circle><text x="600" y="248" font-size="14" fill="#9aa3c7" font-weight="400" text-anchor="middle" font-family="'SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" >A deploy only ships when it survives all six stages.</text>
