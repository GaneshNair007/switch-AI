rt" >Verifies version, command,</text><text x="446" y="392" font-size="16" fill="#9aa3c7" font-weight="400" text-anchor="start" >health checks &amp; owner</text><rect x="806" y="238" width="364" height="186" rx="18" fill="#f9a8d4" fill-opacity=".07" stroke="#f9a8d4" stroke-opacity="0.9" stroke-width="2.5"><animate attributeName="stroke-opacity" values=".4;1;.4" dur="2.4s" repeatCount="indefinite"/></rect><circle cx="868" cy="300" r="38" fill="#f9a8d4" fill-opacity=".18" stroke="#f9a8d4" stroke-width="2.5"/><circle cx="868" cy="300" r="46" fill="none" stroke="#f9a8d4" stroke-opacity=".5" stroke-dasharray="4 8"><animateTransform attributeName="transform" type="rotate" from="0 868 300" to="360 868 300" dur="24s" repeatCount="indefinite"/></circle><text x="868" y="312" font-size="26" fill="#f9a8d4" font-weight="900" text-anchor="middle" font-family="'SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" >HJ</text><text x="932" y="288" font-size="20" fill="#e8eaff" font-weight="800" text-anchor="start" >Human Release Judge</text><text x="932" y="312" font-size="12.5" fill="#f9a8d4" font-weight="700" text-anchor="start" font-family="'SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" letter-spacing="2">THE ONLY GAVEL</text><text x="834" y="368" font-size="16" fill="#9aa3c7" font-weight="400" text-anchor="start" >Exclusive approver role.</text><text x="834" y="392" font-size="16" fill="#9aa3c7" font-weight="400" text-anchor="start" >APPROVE · BLOCK · CONDITIONS</text>
