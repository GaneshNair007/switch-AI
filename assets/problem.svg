<rect width="1200" height="380" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="378" rx="21" fill="none" stroke="#fff" stroke-opacity=".09"/>
<rect x="30" y="30" width="520" height="320" rx="18" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-opacity=".6"/><rect x="650" y="30" width="520" height="320" rx="18" fill="#4ade80" fill-opacity=".08" stroke="#4ade80" stroke-opacity=".6"/><text x="60" y="78" font-size="15" fill="#fb7185" font-weight="800" text-anchor="start" font-family="'SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" letter-spacing="4">BEFORE</text><text x="60" y="112" font-size="30" fill="#e8eaff" font-weight="800" text-anchor="start" >Deploy and pray</text><text x="680" y="78" font-size="15" fill="#4ade80" font-weight="800" text-anchor="start" font-family="'SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" letter-spacing="4">AFTER · SHIP COURT</text><text x="680" y="112" font-size="30" fill="#e8eaff" font-weight="800" text-anchor="start" >Deploy on trial</text><g><text x="60" y="165" font-size="19" fill="#fb7185" font-weight="800">✕</text><text x="92" y="165" font-size="19" fill="#9aa3c7" font-weight="400" text-anchor="start" >“LGTM” rubber-stamp reviews</text><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.0s" fill="freeze"/></g><g><text x="680" y="165" font-size="19" fill="#4ade80" font-weight="800">✓</text><text x="712" y="165" font-size="19" fill="#e8eaff" font-weight="400" text-anchor="start" >A Prosecutor must object — with evidence</text><animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.4s" fill="freeze"/></g><g><text x="60" y="205" font-size="19" fill="#fb7185" font-weight="800">✕</text><text x="92" y="205" font-size="19" fill="#9aa3c7" font-weight="400" text-anchor="start" >Nobody argues against shipping</text><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.25s" fill="freeze"/></g><g><text x="680" y="205" font-size="19" fill="#4ade80" font-weight="800">✓</text><text x="712" y="205" font-size="19" fill="#e8eaff" font-weight="400" text-anchor="start" >A Defender must answer, or concede</text><animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.65s" fill="freeze"/></g><g><text x="60" y="245" font-size="19" fill="#fb7185" font-weight="800">✕</text><text x="92" y="245" font-size="19" fill="#9aa3c7" font-weight="400" text-anchor="start" >Rollback plans are untested folklore</text><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.5s" fill="freeze"/></g><g><text x="680" y="245" font-size="19" fill="#4ade80" font-weight="800">✓</text><text x="712" y="245" font-size="19" fill="#e8eaff" font-weight="400" text-anchor="start" >A Rollback Engineer proves reversibility</text><animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.9s" fill="freeze"/></g><g><text x="60" y="285" font-size="19" fill="#fb7185" font-weight="800">✕</text><text x="92" y="285" font-size="19" fill="#9aa3c7" font-weight="400" text-anchor="start" >Teammates’ AI agents collide in silence</text><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.75s" fill="freeze"/></g><g><text x="680" y="285" font-size="19" fill="#4ade80" font-weight="800">✓</text><text x="712" y="285" font-size="19" fill="#e8eaff" font-weight="400" text-anchor="start" >Parallel Earth simulates the blast radius</text><animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.15s" fill="freeze"/></g><g><text x="60" y="325" font-size="19" fill="#fb7185" font-weight="800">✕</text><text x="92" y="325" font-size="19" fill="#9aa3c7" font-weight="400" text-anchor="start" >Meeting decisions vanish into voice history</text><animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.0s" fill="freeze"/></g><g><text x="680" y="325" font-size="19" fill="#4ade80" font-weight="800">✓</text><text x="712" y="325" font-size="19" fill="#e8eaff" font-weight="400" text-anchor="start" >A human judge holds the only gavel</text><animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.4s" fill="freeze"/></g><g filter="url(#glow)"><path d="M565 190H635" stroke="url(#brand)" stroke-width="5" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 80;80 0" dur="1.6s" repeatCount="indefinite"/></path><path d="M622 175L637 190L622 205" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
