<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="Inter,'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif">
<defs>
