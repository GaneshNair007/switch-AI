-opacity=".08" stroke="#f9a8d4" stroke-opacity=".6"><animate attributeName="stroke-opacity" values=".35;.9;.35" dur="3.6s" begin="2.0s" repeatCount="indefinite"/></rect><text x="1060" y="106" font-size="54" fill="#f9a8d4" font-weight="900" text-anchor="middle" filter="url(#glow)">3</text><text x="1060" y="142" font-size="14" fill="#9aa3c7" font-weight="500" text-anchor="middle" >binding human verdicts</text>
