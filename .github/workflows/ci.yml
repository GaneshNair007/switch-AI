name: Ship Court CI & Switch Validation

on:
  push:
    branches: [ main, courtroom-ship-court ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Switch Template Pre-Checks & Multi-Agent Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Switch Console Template Schema Pre-Checks
        run: |
          python switch/validate_template.py

      - name: Run Pytest Suite
        run: |
          python -m pytest -v tests/

      - name: Run Local Courtroom Multi-Agent Simulation
        run: |
          python -m server.local_courtroom_simulation

      - name: Verify Clean-Room CLI Demo
        run: |
          python -m server.main --demo
